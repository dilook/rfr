plugins {
    id 'io.qameta.allure' version '4.3.0'
}

group = 'io.student'
version = '1.0.0'

def allureJavaVersion = '3.0.0'
def allureReportVersion = '3.17.0'
def aspectJVersion = '1.9.25.1'
def junitVersion = '6.1.3'
def playwrightVersion = '1.63.0'
def springVersion = '7.0.9'
def springSecurityVersion = '7.1.1'
def mysqlDriverVersion = '9.7.0'
def flywayVersion = '12.4.0'

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    agent "org.aspectj:aspectjweaver:$aspectJVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation platform("io.qameta.allure:allure-bom:$allureJavaVersion")

    testImplementation "io.qameta.allure:allure-jupiter"
    testImplementation "io.qameta.allure:allure-playwright"
    testImplementation "com.microsoft.playwright:playwright:$playwrightVersion"
    testImplementation "org.springframework:spring-jdbc:$springVersion"
    testImplementation "org.springframework.security:spring-security-crypto:$springSecurityVersion"
    testImplementation "org.flywaydb:flyway-core:$flywayVersion"
    testRuntimeOnly "com.mysql:mysql-connector-j:$mysqlDriverVersion"
    testRuntimeOnly "org.flywaydb:flyway-mysql:$flywayVersion"

    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.platform:junit-platform-testkit"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.aspectj:aspectjrt:$aspectJVersion"
}


allure {
    version = allureReportVersion
    adapter {
        autoconfigure.set(false)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperties providers.gradlePropertiesPrefixedBy('rfr.').get()
    jvmArgumentProviders.add({ ["-javaagent:${configurations.agent.singleFile}"] } as CommandLineArgumentProvider)
    outputs.upToDateWhen { false }
}

tasks.register('e2e', Test) {
    group = 'verification'
    description = 'Runs all rfr-e2e tests with rfr.stand.schema.check=true so StandSchemaExtension refuses a local MySQL whose schemas drift from the backend migrations of the current checkout; plain test, build and IDE runs skip the check'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'rfr.stand.schema.check', 'true'
}

tasks.register('installPlaywright', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}
