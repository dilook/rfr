name: CI

on:
  pull_request:
  # Builds on master populate the Gradle and npm caches that pull requests can read
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      shared: ${{ steps.filter.outputs.shared }}
      auth: ${{ steps.filter.outputs.auth }}
      api: ${{ steps.filter.outputs.api }}
      e2e: ${{ steps.filter.outputs.e2e }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Lets '!' patterns exclude files; with the default 'some' they would match everything else instead
          predicate-quantifier: some-with-excludes
          filters: |
            ci: .github/workflows/ci.yml
            shared: &shared
              - build.gradle
              - settings.gradle
              - gradle.properties
              - gradle/**
              - gradlew
            auth:
              - rfr-auth/**
              - '!**/*.md'
            api:
              - rfr-api/**
              - '!**/*.md'
            e2e:
              - rfr-e2e/**
              - '!**/*.md'
            backend:
              - *shared
              - rfr-auth/**
              - rfr-api/**
              - rfr-e2e/**
              - '!**/*.md'
            frontend:
              - rfr-gql-client/**
              - '!**/*.md'

  backend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - env:
          ALL: ${{ github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.shared == 'true' }}
          AUTH: ${{ needs.changes.outputs.auth }}
          API: ${{ needs.changes.outputs.api }}
          E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          tasks=()
          [[ $ALL == true || $AUTH == true ]] && tasks+=(:rfr-auth:build)
          [[ $ALL == true || $API == true ]] && tasks+=(:rfr-api:build)
          [[ $ALL == true || $E2E == true ]] && tasks+=(:rfr-e2e:testClasses)
          ./gradlew "${tasks[@]}"

  frontend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rfr-gql-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    needs: changes
    if: >-
      github.event_name == 'pull_request' && (
        needs.changes.outputs.ci == 'true' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - run: npm ci
        working-directory: rfr-gql-client
      - run: ./gradlew :rfr-e2e:installPlaywright --args="install --with-deps chromium"
      - run: nohup ./gradlew runAll > runAll.log 2>&1 &
      - run: nohup npm run dev > ../frontend.log 2>&1 &
        working-directory: rfr-gql-client
      - run: |
          for port in 9001 8081 3001; do
            timeout 300 bash -c "until (echo > /dev/tcp/localhost/$port) 2>/dev/null; do sleep 2; done" \
              || { echo "Port $port did not open within 300 seconds"; exit 1; }
          done
      - run: ./gradlew e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: rfr-e2e/build/allure-results
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stand-logs
          path: |
            runAll.log
            frontend.log
